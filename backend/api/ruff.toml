# Ruff configuration for backend
# This prevents ruff from trying to parse poetry's pyproject.toml
target-version = "py312"
line-length = 88

[format]
quote-style = "double"
indent-style = "space"

[lint]
select = ["E", "F", "I", "B"]
ignore = [
    "B008",  # Allow Depends() in function defaults (FastAPI pattern)
    "E501",  # Line too long - not enforced for readability in prompts/docstrings
]
fixable = ["ALL"]
